name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read # required for checkout

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            target: build
          - name: Format Check
            target: fmt-check
          - name: Go Fix Check
            target: fix-check
          - name: Vet
            target: vet
          - name: Test
            target: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ${{ matrix.target }}
